<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>무치무치</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 한 칸 세로 피드. 상단에 스트레스 게이지가 고정되고, 카드는 출처와 원문 버튼을 항상 갖는다. */
:root {
  --bg: #eef3ef;
  --surface: #ffffff;
  --fg: #1d2b27;
  --muted: #5d6f69;
  --line: #d5e0da;
  --accent: #1f8a6b;
  --accent-ink: #ffffff;
  --warm: #e0803a;
  --soft: #dcebe3;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-display: "Do Hyeon", "Noto Sans KR", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101a17; --surface: #182622; --fg: #e6efeb; --muted: #9bb0a8; --line: #2a3d37;
    --accent: #4cc9a0; --accent-ink: #0c1d17; --warm: #f0a263; --soft: #20352e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101a17; --surface: #182622; --fg: #e6efeb; --muted: #9bb0a8; --line: #2a3d37;
  --accent: #4cc9a0; --accent-ink: #0c1d17; --warm: #f0a263; --soft: #20352e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
.wrap { max-width: 480px; margin: 0 auto; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

header.top { padding-top: 20px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-size: 28px; letter-spacing: .02em; }
.sample { font-size: 12px; color: var(--muted); }

.gauge {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; margin-top: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
}
.gauge-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.gauge-label { font-size: 13px; color: var(--muted); }
.gauge-num { font-family: var(--font-display); font-size: 30px; font-variant-numeric: tabular-nums; line-height: 1; }
.bar { height: 10px; background: var(--soft); border-radius: 6px; margin-top: 8px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--accent), var(--warm)); background-size: 480px 100%; border-radius: 6px; transition: width .6s ease; }
.progress { font-size: 12px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }

.intro { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-top: 16px; }
.intro h1 { font-family: var(--font-display); font-weight: 400; font-size: 24px; margin: 0 0 4px; text-wrap: balance; }
.intro p { margin: 0 0 16px; color: var(--muted); }
.intro .big { font-family: var(--font-display); font-size: 44px; font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 12px 18px; font-weight: 700; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); font-weight: 500; }

.tabs { display: flex; gap: 8px; margin-top: 16px; overflow-x: auto; padding-bottom: 2px; }
.tab { white-space: nowrap; background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 14px; color: var(--muted); }
.tab[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }

.feed { display: flex; flex-direction: column; gap: 14px; margin-top: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; scroll-margin-top: 130px; }
.card.seen { border-color: var(--accent); }
.thumb { display:block; position:relative; width:100%; aspect-ratio:16/9; padding:0; border:0; background:#000; overflow:hidden; }
.thumb img { width:100%; height:100%; object-fit:cover; display:block; }
.thumb .play { position:absolute; inset:0; margin:auto; width:56px; height:56px; border-radius:50%; background:rgba(0,0,0,.55); color:#fff; display:grid; place-items:center; font-size:20px; }
.newsimg { display:block; aspect-ratio:16/9; background:var(--soft); overflow:hidden; }
.newsimg img { width:100%; height:100%; object-fit:cover; display:block; }
.player { aspect-ratio:16/9; background:#000; }
.player iframe { width:100%; height:100%; border:0; display:block; }
.btn:disabled { opacity:.5; cursor:default; }
.media { aspect-ratio: 16 / 9; max-width: 100%; display: grid; place-items: center; color: #fff; text-align: center; padding: 12px; font-size: 13px; }
.media .play { width: 52px; height: 52px; border-radius: 50%; background: rgba(0,0,0,.35); display: grid; place-items: center; margin: 0 auto 6px; font-size: 20px; }
.m-heal { background: linear-gradient(135deg, #2f7d6b, #7cc4a2); }
.m-laugh { background: linear-gradient(135deg, #d9822b, #f3c26b); }
.m-touch { background: linear-gradient(135deg, #b4566f, #e9a3a6); }
.m-hope { background: linear-gradient(135deg, #3a6ea5, #86b6e0); }
.body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--muted); }
.chip { background: var(--soft); color: var(--fg); border-radius: 6px; padding: 2px 8px; font-weight: 700; }
.card h2 { font-size: 17px; line-height: 1.4; margin: 0; text-wrap: balance; }
.card p.sum { margin: 0; color: var(--muted); }
.src { font-size: 13px; }
.src b { font-weight: 700; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
a.go { background: var(--accent); color: var(--accent-ink); text-decoration: none; border-radius: 10px; padding: 9px 14px; font-weight: 700; font-size: 14px; }
.act { background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 14px; }
.act[aria-pressed=true] { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.act.hide { color: var(--muted); margin-left: auto; }

.done { background: var(--surface); border: 1px solid var(--accent); border-radius: 14px; padding: 20px; margin-top: 16px; }
.done h2 { font-family: var(--font-display); font-weight: 400; font-size: 24px; margin: 0 0 6px; }
.done p { margin: 0 0 14px; color: var(--muted); }
.coffee { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.server { font-size: 13px; color: var(--muted); }
.server .bar { margin-top: 4px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 20; }
.empty { text-align: center; color: var(--muted); padding: 28px 0; }
footer { margin-top: 24px; font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div class="brand">무치무치</div><div class="sample">나쁜 소식 없는 피드</div></header>
  <section class="gauge" id="gauge" hidden aria-live="polite">
    <div class="gauge-row"><span class="gauge-label">지금 스트레스</span><span class="gauge-num"><span id="gnum">0</span>%</span></div>
    <div class="bar"><i id="gbar"></i></div>
    <div class="progress" id="gprog"></div>
  </section>
  <section class="intro" id="intro">
    <h1>지금 스트레스는 몇 %인가요?</h1>
    <p>동물 영상 위주로 계속 이어집니다. 보는 만큼 줄어들고, 나쁜 소식은 없습니다.</p>
    <div class="big"><span id="sval">70</span>%</div>
    <label for="slider" class="sample">스트레스 정도</label>
    <input type="range" id="slider" min="10" max="100" step="5" value="70">
    <p id="loadmsg" class="sample">불러오는 중…</p>
    <button class="btn" id="start" disabled>시작하기</button>
  </section>
  <div id="app" hidden>
    <div class="tabs" id="tabs" role="group" aria-label="기분 선택"></div>
    <div id="doneBox"></div>
    <div class="feed" id="feed"></div>
    <div id="sentinel" class="empty">더 불러오는 중…</div>
  </div>
  <footer>영상은 유튜브 공식 플레이어로 재생하고, 뉴스는 제목과 출처만 보여준 뒤 원문으로 연결합니다. 콘텐츠의 권리는 각 원작자와 언론사에 있습니다.</footer>
</div>
<div class="toast" id="toast" hidden></div>
<script>
const MOODS = [["all","전체"],["heal","힐링"],["laugh","웃음"],["touch","감동"],["hope","희망"]];
const TYPE_LABEL = { video: "영상", news: "뉴스" };
const MOOD_LABEL = { heal: "힐링", laugh: "웃음", touch: "감동", hope: "희망" };
const BATCH = 12;   // 12개 = 영상 10 + 뉴스 2

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = u => /^https:\/\//.test(u) ? u : "#";

let ITEMS = [];
const state = { start: 70, mood: "all", seen: new Set(), saved: new Set(), hidden: new Set(), uid: 0, a: 0, o: 0, m: 0, supportShown: false };
try { JSON.parse(localStorage.getItem("moochi-saved") || "[]").forEach(i => state.saved.add(i)); } catch (e) {}
function persist() { try { localStorage.setItem("moochi-saved", JSON.stringify([...state.saved])); } catch (e) {} }

function ago(iso) {
  const m = Math.max(1, Math.round((Date.now() - Date.parse(iso)) / 60000));
  if (m < 60) return m + "분 전";
  if (m < 1440) return Math.round(m / 60) + "시간 전";
  return Math.round(m / 1440) + "일 전";
}

const pool = f => ITEMS.filter(i => !state.hidden.has(i.id) && f(i));
const take = (list, k) => list.length ? list[state[k]++ % list.length] : null;

// 무한 피드. 영상 5개당 뉴스 1개. 항목이 바닥나면 처음부터 다시 돈다.
function nextBatch() {
  const out = [];
  const mood = state.mood === "all" ? () => true : i => i.mood === state.mood;
  const videos = pool(i => i.type === "video" && mood(i)), news = pool(i => i.type === "news" && mood(i));
  for (let n = 0; n < BATCH; n++) {
    const wantNews = n % 6 === 5;
    const it = (wantNews ? take(news, "o") : take(videos, "a")) || take(videos, "a") || take(news, "o");
    if (it) out.push(it);
  }
  return out.map(it => ({ ...it, uid: ++state.uid }));
}

let toastTimer;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 1800); }

function renderTabs() {
  $("tabs").innerHTML = MOODS.map(([k, v]) => `<button class="tab" data-m="${k}" aria-pressed="${state.mood === k}">${v}</button>`).join("");
}

function cardHTML(i) {
  const media = i.type === "video"
    ? `<button class="thumb" data-play="${esc(i.videoId)}" aria-label="영상 재생"><img loading="lazy" alt="" src="https://i.ytimg.com/vi/${esc(i.videoId)}/hqdefault.jpg"><span class="play">▶</span></button>` : (i.image ? `<a class="newsimg" href="${esc(safeUrl(i.link))}" target="_blank" rel="noopener noreferrer" aria-label="원문 보러가기"><img loading="lazy" alt="" referrerpolicy="no-referrer" src="${esc(safeUrl(i.image))}" onerror="this.closest('a').remove()"></a>` : "");
  const cta = i.type === "video" ? "유튜브에서 보기" : "원문 보러가기";
  return `<article class="card" data-uid="${i.uid}" data-id="${esc(i.id)}">
    ${media}
    <div class="body">
      <div class="meta"><span class="chip">${TYPE_LABEL[i.type]}</span><span>${MOOD_LABEL[i.mood] || ""}</span><span>${ago(i.time)}</span></div>
      <h2>${esc(i.title)}</h2>
      <div class="src">출처 <b>${esc(i.source)}</b></div>
      <div class="actions">
        <a class="go" href="${esc(safeUrl(i.link))}" target="_blank" rel="noopener noreferrer">${cta}</a>
        <button class="act" data-a="save" aria-pressed="${state.saved.has(i.id)}">${state.saved.has(i.id) ? "저장됨" : "저장"}</button>
        <button class="act" data-a="share">링크 복사</button>
        <button class="act hide" data-a="hide">기분 안 좋아요</button>
      </div>
    </div>
  </article>`;
}

let seenObs, moreObs;
function setupObservers() {
  if (seenObs) seenObs.disconnect();
  if (moreObs) moreObs.disconnect();
  seenObs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { markSeen(+e.target.dataset.uid); seenObs.unobserve(e.target); } }), { threshold: 0.7 });
  moreObs = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) loadMore(); }, { rootMargin: "600px 0px" });
  moreObs.observe($("sentinel"));
}

function loadMore() {
  const batch = nextBatch();
  if (!batch.length) { $("sentinel").textContent = "이 탭에는 보여줄 항목이 없어요."; return; }
  $("feed").insertAdjacentHTML("beforeend", batch.map(cardHTML).join(""));
  $("feed").querySelectorAll(".card:not([data-obs])").forEach(c => { c.dataset.obs = "1"; seenObs.observe(c); });
}

function resetFeed() {
  $("feed").innerHTML = ""; state.a = state.o = state.m = 0; $("sentinel").textContent = "더 불러오는 중…";
  setupObservers(); loadMore(); updateGauge();
}

function markSeen(uid) {
  if (state.seen.has(uid)) return;
  state.seen.add(uid);
  const el = document.querySelector(`.card[data-uid="${uid}"]`); if (el) el.classList.add("seen");
  updateGauge();
}

function updateGauge() {   // 볼 때마다 약 10%씩 줄어든다
  const seen = state.seen.size, now = Math.round(state.start * Math.pow(0.9, seen));
  $("gnum").textContent = now; $("gbar").style.width = Math.max(now, 2) + "%";
  $("gprog").textContent = `${seen}개 봤어요 · 계속 내려서 볼 수 있어요`;
  if (now <= 10 && !state.supportShown) showSupport(now);
}

function showSupport(now) {
  state.supportShown = true;
  $("doneBox").innerHTML = `<section class="done">
    <h2>기분이 좀 나아지셨나요?</h2>
    <p>스트레스가 ${state.start}%에서 ${now}%로 내려갔어요. 마음에 드셨다면 커피 한 잔으로 이 사이트를 지켜 주세요. 닫고 계속 보셔도 됩니다.</p>
    <p class="server">후원 링크는 준비 중입니다.</p>
    <button class="btn ghost" id="closeDone">닫기</button>
  </section>`;
}

async function boot() {
  try {
    const r = await fetch("feed.json", { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    ITEMS = d.items || [];
    if (!ITEMS.length) { $("loadmsg").textContent = "아직 수집된 콘텐츠가 없습니다. 수집이 한 번 실행되면 보여요."; return; }
    $("loadmsg").hidden = true; $("start").disabled = false;
  } catch (e) { $("loadmsg").textContent = "콘텐츠를 불러오지 못했어요. 잠시 뒤 다시 열어 주세요."; }
}

$("slider").addEventListener("input", e => { $("sval").textContent = e.target.value; });
$("start").addEventListener("click", () => {
  state.start = +$("slider").value;
  $("intro").hidden = true; $("gauge").hidden = false; $("app").hidden = false;
  renderTabs(); resetFeed();
});
$("tabs").addEventListener("click", e => { const b = e.target.closest(".tab"); if (!b) return; state.mood = b.dataset.m; renderTabs(); resetFeed(); });
$("feed").addEventListener("click", e => {
  const p = e.target.closest("[data-play]");
  if (p) {
    const id = p.dataset.play;
    p.outerHTML = `<div class="player"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0&playsinline=1" title="영상" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`;
    return;
  }
  const b = e.target.closest("[data-a]"); if (!b) return;
  const card = b.closest(".card"), id = card.dataset.id, item = ITEMS.find(i => i.id === id);
  if (b.dataset.a === "save") {
    state.saved.has(id) ? state.saved.delete(id) : state.saved.add(id); persist();
    b.setAttribute("aria-pressed", state.saved.has(id)); b.textContent = state.saved.has(id) ? "저장됨" : "저장";
  } else if (b.dataset.a === "share") {
    const fb = () => toast("복사가 막혀 있어요. 원문 버튼으로 주소를 확인해 주세요.");
    try { navigator.clipboard.writeText(`${item.title} ${item.link}`).then(() => toast("링크를 복사했어요"), fb); } catch (err) { fb(); }
  } else if (b.dataset.a === "hide") { state.hidden.add(id); card.remove(); toast("앞으로 비슷한 글을 줄일게요"); }
});
$("doneBox").addEventListener("click", e => { if (e.target.id === "closeDone") $("doneBox").innerHTML = ""; });
boot();

</script>
</body>
</html>
