name: collect
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      quick:
        description: 'Test without YouTube search (cheap). Writes feed.quick.json only.'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/collect.mjs
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          NO_SEARCH: ${{ inputs.quick && '1' || '' }}
      - name: Commit feed
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json channels-cache.json
          git diff --cached --quiet || (git commit -m "Update feed" && for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done)
